name: Medium Feed Scheduled Sync

on:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and Sync Medium Feed
        run: node scripts/sync-medium.js

      - name: Commit and push changes if feed updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/mediumFeed.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): update Medium articles from RSS feed [skip ci]"
            git push
          else
            echo "No new Medium articles to sync."
          fi
