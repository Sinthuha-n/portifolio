<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%235B21B6'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='50' fill='%23FFFFFF'>SN</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sinthuha Nadesan | Software Engineering Portfolio</title>
    <meta name="description" content="Portfolio of Sinthuha Nadesan, BSc (Hons) IT undergraduate at University of Moratuwa. Software Engineering, DevOps, and Mobile Development." />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Apply theme and scroll restoration before first paint: Defaults to Light for first-time visitors, respects saved preference & ?theme query -->
    <script>
      (function() {
        // Prevent browser from restoring stale scroll position down the page on reload
        if ('scrollRestoration' in history) {
          history.scrollRestoration = 'manual';
        }

        // On full reload of the homepage: clear stale section hash and reset scroll to top immediately (zero jump)
        try {
          const navEntries = performance.getEntriesByType && performance.getEntriesByType('navigation');
          const isReload = (navEntries && navEntries[0] && navEntries[0].type === 'reload') ||
                           (performance.navigation && performance.navigation.type === 1);
          if (isReload) {
            if (window.location.hash) {
              history.replaceState(null, '', window.location.pathname + window.location.search);
            }
            window.scrollTo(0, 0);
          }
        } catch (_) {}

        try {
          const params = new URLSearchParams(window.location.search);
          const urlTheme = params.get('theme');
          const stored = urlTheme || localStorage.getItem('portfolio-theme');
          if (stored === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (stored === 'system') {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-theme-bg text-theme-text antialiased selection:bg-purple-heading selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
